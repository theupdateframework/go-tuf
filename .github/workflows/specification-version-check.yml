on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions: {}

name: Specification version check
jobs:
  # Get the version of the TUF specification go-tuf states it supports
  get-supported-tuf-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read SPECIFICATION_VERSION
        id: get-version
        shell: bash
        env:
          SOURCE_FILE: metadata/types.go
        run: |
          # Read the constant from the source so that nothing has to be built.
          # The next job puts this value into a script and an issue, so fail
          # unless it is declared exactly once, as a plain "X.Y.Z" string.
          pattern='^[[:space:]]*(const[[:space:]]+)?SPECIFICATION_VERSION[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)"[[:space:]]*(//.*)?$'
          version="$(sed -nE "s#${pattern}#\2#p" "${SOURCE_FILE}")"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=${SOURCE_FILE}::Expected exactly one SPECIFICATION_VERSION = \"X.Y.Z\" declaration, found: '${version//$'\n'/, }'"
            exit 1
          fi
          echo "Supported TUF specification version: v${version}"
          echo "version=v${version}" >> "${GITHUB_OUTPUT}"

  # Get the latest TUF specification release and open an issue (if needed)
  specification-bump-check:
    needs: get-supported-tuf-version
    permissions:
      contents: read
      issues: write # open the "TUF specification has a new version" issue
    # Pinned to a commit on master: the specification's release tags version
    # the specification text, not this workflow.
    uses: theupdateframework/specification/.github/workflows/check-latest-spec-version.yml@e2bc7d83d0740aaae8dd7133dd4f237ce3d86b16 # master
    with:
      tuf-version: ${{ needs.get-supported-tuf-version.outputs.version }}
